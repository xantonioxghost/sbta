<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Posture Monitor</title>
    <style id="expo-reset">
      *, *::before, *::after {
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #080F0E;
      }

      body {
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Phone frame (desktop / tablet) ── */
      #root {
        display: flex;
        flex: 1;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      @media (min-width: 500px) {
        body {
          background: #040807;
        }

        #root {
          width: 390px;
          max-width: 390px;
          height: 844px;
          max-height: 100dvh;
          border-radius: 44px;
          overflow: hidden;
          box-shadow:
            0 0 0 1px rgba(0, 229, 195, 0.15),
            0 32px 80px rgba(0, 0, 0, 0.9),
            0 8px 24px rgba(0, 0, 0, 0.7);
          flex: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
